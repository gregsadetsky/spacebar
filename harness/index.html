<!doctype html>
<!--
  browser-only dev harness: write a plugin with no xcode, no app.
    cd spacebar && python3 -m http.server 8000
    open http://localhost:8000/harness/?plugin=geojson&sample=cities.geojson
  the plugin loads in an iframe with a fake window.spacebar. for input=sqlite or plist,
  the harness fetches <sample>.json (make samples writes samples/library.sqlite3.json
  with the real host-side summary via spacebar-cli dump).
-->
<html>
<head>
  <meta charset="utf-8">
  <title>spacebar harness</title>
  <style>
    :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --border: #e5e5ea; --panel: #f5f5f7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --fg: #f2f2f2; --muted: #9a9a9e; --border: #3a3a3c; --panel: #2a2a2c; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font: 13px -apple-system, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
    form { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); flex: 0 0 auto; }
    input, select, button { font: inherit; }
    input { width: 220px; }
    #status { margin-left: auto; color: var(--muted); }
    #status.ok { color: #2a9d4b; } #status.bad { color: #d1433a; }
    main { display: flex; flex: 1 1 auto; min-height: 0; }
    iframe { flex: 1 1 auto; border: 0; min-width: 0; }
    #console { flex: 0 0 280px; border-left: 1px solid var(--border); overflow: auto; padding: 6px 8px; font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <form id="form">
    <label>plugin <input name="plugin" placeholder="geojson"></label>
    <label>sample <input name="sample" placeholder="cities.geojson"></label>
    <label>theme <select name="theme"><option value="">system</option><option>light</option><option>dark</option></select></label>
    <button type="submit">Load</button>
    <span id="status"></span>
  </form>
  <main>
    <iframe id="frame"></iframe>
    <div id="console"></div>
  </main>
  <script>
    var params = new URLSearchParams(location.search);
    var form = document.getElementById("form");
    form.plugin.value = params.get("plugin") || "geojson";
    form.sample.value = params.get("sample") || "cities.geojson";
    form.theme.value = params.get("theme") || "";
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var q = new URLSearchParams({ plugin: form.plugin.value, sample: form.sample.value });
      if (form.theme.value) q.set("theme", form.theme.value);
      location.search = q.toString();
    });

    var out = document.getElementById("console");
    var statusEl = document.getElementById("status"); // not "status": window.status stringifies assignments
    var t0 = performance.now();
    function log(line) { out.textContent += line + "\n"; out.scrollTop = out.scrollHeight; }
    function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; log("host: " + text); }

    async function load() {
      var plugin = form.plugin.value, sample = form.sample.value;
      var pluginDir = "../plugins/" + plugin + "/";
      var manifest;
      try { manifest = await (await fetch(pluginDir + "plugin.json")).json(); }
      catch (e) { return setStatus("cannot load " + pluginDir + "plugin.json", "bad"); }
      var sampleURL = "../samples/" + sample;
      var data, size;
      try {
        if (manifest.input === "sqlite" || manifest.input === "plist") {
          var dump = await fetch(sampleURL + ".json");
          if (!dump.ok) throw new Error(dump.status);
          data = await dump.json();
          size = manifest.input === "sqlite" ? data.fileSize : (await (await fetch(sampleURL)).arrayBuffer()).byteLength;
        } else {
          var r = await fetch(sampleURL);
          if (!r.ok) throw new Error(r.status);
          if (manifest.input === "text") { data = await r.text(); size = new Blob([data]).size; }
          else if (manifest.input === "json") { data = await r.json(); size = 0; }
          else { var buf = await r.arrayBuffer(); size = buf.byteLength; data = btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
        }
      } catch (e) { return setStatus("cannot load sample " + sampleURL + " (" + e.message + ")" + (["sqlite", "plist", "archive", "epub"].includes(manifest.input) ? " — run make samples to write the .json dump" : ""), "bad"); }

      var theme = form.theme.value || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var frame = document.getElementById("frame");
      var bridge = {
        host: { version: "harness" },
        plugin: { id: manifest.id, name: manifest.name, version: manifest.version },
        file: { name: sample, path: "/samples/" + sample, size: size, uti: null, ext: sample.split(".").pop().toLowerCase() },
        input: manifest.input,
        data: data,
        theme: theme,
        done: function () { setStatus("done in " + Math.round(performance.now() - t0) + " ms", "ok"); },
        fail: function (m) { setStatus("fail: " + m, "bad"); },
        log: function (m) { log("[" + manifest.id + "] " + m); }
      };
      // inject before the plugin's scripts run: build the document by hand
      var html = await (await fetch(pluginDir + (manifest.entry || "index.html"))).text();
      var doc = frame.contentDocument;
      frame.addEventListener("load", function () {}, { once: true });
      doc.open();
      frame.contentWindow.spacebar = bridge;
      var base = new URL(pluginDir, location.href).href;
      var withBase = html.replace(/<head([^>]*)>/i, "<head$1><base href=\"" + base + "\">");
      if (withBase === html) withBase = "<base href=\"" + base + "\">" + html;
      t0 = performance.now();
      doc.write(withBase);
      doc.close();
      frame.contentWindow.addEventListener("error", function (e) { bridge.fail("uncaught: " + e.message); });
      setTimeout(function () { if (!statusEl.className) setStatus("no done()/fail() after 3 s (host would time out)", "bad"); }, 3000);
      log("loaded " + plugin + " with " + sample + " (" + manifest.input + ", " + size + " bytes, " + theme + ")");
    }
    load();
  </script>
</body>
</html>
