<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Jupyter Notebook</title>
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="file"><h1 id="title"></h1><span id="meta"></span></div>
    <button id="toggle-code" aria-pressed="false">Hide code</button>
  </header>
  <main>
    <article id="notebook" aria-label="Notebook cells"></article>
    <div class="paging"><button id="more" hidden>Show more cells</button></div>
  </main>
  <footer><span>Jupyter Notebook</span><span id="progress" role="status" aria-live="polite"></span></footer>
  <script src="vendor/notebook.js"></script>
</body>
</html>
