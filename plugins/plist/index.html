<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="file"><h1 id="title"></h1><span id="meta"></span></div>
    <div class="controls">
      <div class="switch" aria-label="View">
        <button id="tree-button" aria-pressed="true">Tree</button>
        <button id="json-button" aria-pressed="false">JSON</button>
      </div>
      <button id="copy">Copy as JSON</button>
    </div>
  </header>
  <main>
    <div id="tree" aria-label="Property list"></div>
    <textarea id="json" aria-label="Property list as JSON" readonly spellcheck="false" hidden></textarea>
  </main>
  <footer><span>Property List</span><span id="status" role="status" aria-live="polite"></span></footer>
  <script src="index.js"></script>
</body>
</html>
