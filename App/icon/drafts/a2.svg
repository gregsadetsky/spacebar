<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#091526"/>
    </linearGradient>
    <linearGradient id="keyBase2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="keyTop2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- macOS rounded square background -->
  <rect x="64" y="64" width="896" height="896" rx="225" fill="url(#bg2)"/>
  <rect x="66" y="66" width="892" height="892" rx="223" fill="none" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Spacebar keycap -->
  <g filter="url(#shadow2)">
    <rect x="156" y="384" width="712" height="264" rx="46" fill="url(#keyBase2)"/>
    <rect x="178" y="392" width="668" height="208" rx="34" fill="url(#keyTop2)"/>
    <rect x="178" y="392" width="668" height="208" rx="34" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Subtle map grid lines printed on keycap top -->
  <path d="M 240 440 L 784 440 M 240 496 L 784 496 M 240 552 L 784 552 M 340 416 L 340 576 M 512 416 L 512 576 M 684 416 L 684 576" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 10"/>

  <!-- Map polyline and waypoint dots on keycap top -->
  <path d="M 276 534 L 404 452 L 542 522 L 668 444 L 748 486" fill="none" stroke="url(#routeGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Waypoint dots (using path circles for pure rect/path compatibility) -->
  <path d="M 276 518 A 16 16 0 1 0 276 550 A 16 16 0 1 0 276 518 Z" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M 404 436 A 16 16 0 1 0 404 468 A 16 16 0 1 0 404 436 Z" fill="#0284C7" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M 542 506 A 16 16 0 1 0 542 538 A 16 16 0 1 0 542 506 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M 668 428 A 16 16 0 1 0 668 460 A 16 16 0 1 0 668 428 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M 748 468 A 18 18 0 1 0 748 504 A 18 18 0 1 0 748 468 Z" fill="#F43F5E" stroke="#FFFFFF" stroke-width="5"/>
</svg>