<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5E3A"/>
      <stop offset="100%" stop-color="#FF2A68"/>
    </linearGradient>
    <filter id="shadow3" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#8A0030" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Vivid solid/subtle-gradient macOS background -->
  <rect x="64" y="64" width="896" height="896" rx="225" fill="url(#bg3)"/>

  <!-- Minimal flat white spacebar keycap outline -->
  <g filter="url(#shadow3)">
    <!-- Outer keycap boundary -->
    <rect x="168" y="388" width="688" height="248" rx="48" fill="none" stroke="#FFFFFF" stroke-width="24"/>
    <!-- Inner keycap top rim -->
    <rect x="212" y="420" width="600" height="156" rx="26" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-opacity="0.85"/>
    <!-- Corner chamfers connecting top rim to outer skirt -->
    <path d="M 184 404 L 220 428 M 840 404 L 804 428 M 184 620 L 220 568 M 840 620 L 804 568" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-opacity="0.85"/>
    <!-- Minimalist spacebar tray icon inside -->
    <path d="M 452 522 L 452 536 L 572 536 L 572 522" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>