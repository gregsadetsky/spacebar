<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2430"/>
      <stop offset="100%" stop-color="#0F131A"/>
    </linearGradient>
    <linearGradient id="keySide1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0D5DD"/>
      <stop offset="100%" stop-color="#98A2B3"/>
    </linearGradient>
    <linearGradient id="keyTop1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAECF0"/>
    </linearGradient>
    <linearGradient id="dish1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4E7EC"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- macOS squircle background -->
  <rect x="64" y="64" width="896" height="896" rx="225" fill="url(#bg1)"/>
  <rect x="66" y="66" width="892" height="892" rx="223" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Keycap well / recess -->
  <rect x="148" y="396" width="728" height="264" rx="52" fill="#090C10"/>

  <!-- Keycap outer Skirt (seen from slightly above) -->
  <g filter="url(#shadow1)">
    <rect x="164" y="388" width="696" height="248" rx="44" fill="url(#keySide1)"/>
    <!-- Keycap top surface -->
    <rect x="184" y="396" width="656" height="196" rx="34" fill="url(#keyTop1)"/>
    <!-- Subtle convex spacebar shine -->
    <rect x="200" y="406" width="624" height="176" rx="28" fill="url(#dish1)"/>
    <!-- Front bevel highlight -->
    <rect x="184" y="396" width="656" height="196" rx="34" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Subtle 'space' label and bar indicator -->
  <path d="M 464 538 L 464 548 L 560 548 L 560 538" fill="none" stroke="#667085" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>