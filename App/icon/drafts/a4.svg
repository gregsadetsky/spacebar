<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="isoTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="isoLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="isoRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="36" stdDeviation="24" flood-color="#090721" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- macOS Big Sur squircle background -->
  <rect x="64" y="64" width="896" height="896" rx="225" fill="url(#bg4)"/>
  <rect x="66" y="66" width="892" height="892" rx="223" fill="none" stroke="#A5B4FC" stroke-opacity="0.16" stroke-width="4"/>

  <!-- Isometric 3D spacebar keycap -->
  <g filter="url(#shadow4)">
    <!-- Switch plate / dark base shadow silhouette -->
    <path d="M 164 476 L 596 226 L 860 378 L 428 628 Z" fill="#131136"/>

    <!-- Left-front long skirt face -->
    <path d="M 212 430 L 620 194 L 860 332 L 860 398 L 428 648 L 164 496 L 212 430 Z" fill="url(#isoLeft)"/>

    <!-- Right-front short skirt face -->
    <path d="M 412 546 L 820 310 L 860 398 L 428 648 Z" fill="url(#isoRight)"/>

    <!-- Front-left skirt bevel -->
    <path d="M 212 430 L 412 546 L 428 648 L 164 496 Z" fill="url(#isoLeft)"/>

    <!-- Keycap Top Face (isometric parallelogram with rounded appearance) -->
    <path d="M 212 430 L 620 194 L 820 310 L 412 546 Z" fill="url(#isoTop)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

    <!-- Subtle isometric concave/convex highlight on top face -->
    <path d="M 244 428 L 618 212 L 788 310 L 414 526 Z" fill="none" stroke="#C7D2FE" stroke-width="3" stroke-linejoin="round"/>

    <!-- Isometric 'space' bar glyph on the keycap top -->
    <path d="M 476 428 L 490 436 L 576 386 L 562 378" fill="none" stroke="#6366F1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>